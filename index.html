function readFileText(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const buf = r.result;
      let txt = new TextDecoder('utf-8').decode(buf);
      // Si no venía en UTF-8 (CSV "normal" de Excel), se re-lee como Windows-1252 para no perder acentos.
      if(txt.includes('�')){ try{ txt = new TextDecoder('windows-1252').decode(buf); }catch(e){} }
      resolve(txt);
    };
    r.onerror = ()=>reject(r.error);
    r.readAsArrayBuffer(file);
  });
}
async function onImportFile(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  try{
    const txt = await readFileText(f);
    $('impText').value = txt;
    toast('Archivo leído: ' + f.name);
    analyzeImport();
  }catch(err){ alert('No se pudo leer el archivo.'); }
  e.target.value = '';
}
function analyzeImport(){
  const txt = $('impText').value;
  const parsed = parseInput(txt);
  const box = $('impPrev');
  if(!parsed.filas.length){ box.innerHTML = '<div class="help" style="margin-top:12px">No encontré filas con datos.</div>'; lastPlan=null; return; }
  const plan = planMerge(store, parsed);
  lastPlan = plan;
  const li = plan.items.map(it=>{
    if(it.tipo==='error') return `<li class="err"><span class="pt">Error</span>Línea ${it.line}${it.data&&it.data.cliente?' ('+esc(properCase(it.data.cliente))+')':''}: ${esc(it.errores.join('; '))}</li>`;
    const nom = it.data.cliente || (store.cuentas[it.id]||{}).cliente || '';
    const det = it.tipo==='nueva'
      ? `${esc(it.data.status||'')} · ${esc(it.data.dias!==undefined?it.data.dias:0)} días`
      : (it.cambios.length ? esc(it.cambios.join(' · ')) : 'Sin cambios en atraso') + (it.archivada?' · (está archivada, sigue archivada)':'');
    return `<li><span class="pt ${it.tipo==='nueva'?'n':'u'}">${it.tipo==='nueva'?'Nueva':'Actualiza'}</span><b>${esc(properCase(nom))}</b> #${esc(it.id)}<div class="pd">${det}</div></li>`;
  }).join('');
  const validas = plan.nuevas + plan.actualizadas;
  box.innerHTML = `
    <div class="prev-sum">
      <span class="flag ok">${plan.nuevas} nuevas</span>
      <span class="flag" style="color:var(--blue)">${plan.actualizadas} actualizadas</span>
      <span class="flag ${plan.errores?'bad':''}">${plan.errores} con error</span>
    </div>
    ${parsed.conEncabezado ? `<div class="help">Encabezados reconocidos.${parsed.faltan.length?' No venían: '+esc(parsed.faltan.join(', '))+' (esos datos no se modifican).':''}</div>`
                           : '<div class="help">Sin encabezados: usé el orden estándar de columnas.</div>'}
    ${parsed.modoEspacios ? '<div class="help">ℹ️ El texto llegó sin tabuladores (normal al copiar de WhatsApp en el celular). Separé las columnas por su forma; revisa que nombres y montos se vean bien antes de guardar.</div>' : ''}
    ${parsed.sinTabs && !parsed.conEncabezado ? '<div class="banner" style="margin-top:8px"><span>⚠️ No encontré tabuladores. Copia directamente las celdas de Excel (selecciónalas y Copiar), no el texto de un mensaje o documento.</span></div>' : ''}
    <ul class="prev-list" style="margin-top:8px">${li}</ul>
    <div class="btn-row"><button class="btn primary" data-act="imp-save" ${validas?'':'disabled'}>Guardar ${validas} ${validas===1?'cuenta':'cuentas'}</button></div>`;
}
const UNDO_KEY = STORE_KEY + '_antes_carga';
let undoInfo = null;
function saveImport(){
  if(!lastPlan) return;
  // Copia de cómo estaba todo antes de esta carga, para poder deshacerla.
  try{ localStorage.setItem(UNDO_KEY, JSON.stringify({ts:new Date().toISOString(), data:store})); }catch(e){}
  applyMerge(store, lastPlan, new Date().toISOString());
  const n = lastPlan.nuevas, u = lastPlan.actualizadas;
  if(saveData()){ undoInfo = {n, u}; closeSheet(); clearRoute(); render(); toast(`${n} nuevas · ${u} actualizadas`); }
}
function hayDeshacer(){ try{ return !!localStorage.getItem(UNDO_KEY); }catch(e){ return false; } }
function deshacerCarga(){
  let snap = null;
  try{ snap = JSON.parse(localStorage.getItem(UNDO_KEY)); }catch(e){}
  if(!snap || !snap.data){ toast('No hay carga para deshacer'); return; }
  if(!confirm(`¿Deshacer la última carga (${fmtTs(snap.ts)})?\n\nTodo regresa a como estaba antes de esa carga. Lo que hayas registrado después también se pierde.`)) return;
  store = migrate(snap.data);
  try{ localStorage.removeItem(UNDO_KEY); }catch(e){}
  undoInfo = null; saveData(); closeSheet(); clearRoute(); openDetails.clear(); render(); toast('Carga deshecha');
}
function borrarTodo(){
  const n = cuentasList().length;
  if(!n){ toast('No hay cuentas'); return; }
  if(!confirm(`¿Borrar las ${n} cuentas del teléfono?\n\nSe pierden historial y compromisos. Tus ajustes y plantillas se quedan.`)) return;
  const t = prompt('Para confirmar escribe BORRAR');
  if(!t || t.trim().toUpperCase()!=='BORRAR'){ toast('No se borró nada'); return; }
  try{ localStorage.setItem(STORE_KEY+'_antes_borrar_todo', JSON.stringify(store)); }catch(e){}
  store.cuentas = {}; undoInfo = null;
  saveData(); closeSheet(); clearRoute(); openDetails.clear(); render(); toast('Cuentas borradas');
}

/* Ajustes y respaldo */
function openAjustes(){
  const aj = store.ajustes;
  const n = cuentasList().length, arch = cuentasList().filter(c=>c.archivada).length;
  openSheet(`
    <h2>Ajustes</h2>
    <div class="sh-sub">Se guardan solo en este teléfono.</div>
    <div class="section"><div class="field-label">Mi nombre (para WhatsApp)</div><input class="inp" id="ajNombre" value="${esc(aj.nombre)}"></div>
    <div class="section"><div class="field-label">Titular · al corriente (Del día)</div><textarea class="inp" id="ajDia" rows="7">${esc(aj.tplDelDia)}</textarea></div>
    <div class="section"><div class="field-label">Titular · en atraso (Mora)</div><textarea class="inp" id="ajMora" rows="7">${esc(aj.tplMora)}</textarea></div>
    <div class="section"><div class="field-label">Tercera persona · al corriente</div><textarea class="inp" id="ajTDia" rows="6">${esc(aj.tplTerceroDia)}</textarea></div>
    <div class="section"><div class="field-label">Tercera persona · en atraso</div><textarea class="inp" id="ajTMora" rows="6">${esc(aj.tplTerceroMora)}</textarea>
      <div class="help">{saludo} = Buenos días / tardes / noches según la hora · {cuando} = hoy / mañana / este jueves 17 (si la cuenta trae fecha de vencimiento) · {nombre} = primer nombre del cliente · {cliente} = nombre completo · {yo} = tu nombre.<br>
      Puedes poner varias versiones en una plantilla separándolas con una línea que diga solo <b>---</b>; cada vez se usa una al azar.<br>
      Se usa la de “tercera persona” cuando el teléfono en uso es de un Familiar, Referencia u Otro.<br>
      ⚠️ A terceros nunca menciones adeudo, atraso, montos ni pagos (reglas de cobranza CONDUSEF).</div></div>
    <div class="btn-row">
      <button class="btn" data-act="aj-default">Textos originales</button>
      <button class="btn primary" data-act="aj-save">Guardar ajustes</button>
    </div>

    <div class="section"><div class="field-label">Respaldo</div>
      <div class="kv">Cuentas guardadas: <b>${n}</b> (${arch} archivadas)<br>
      Último respaldo: <b>${store.ultimoRespaldo?esc(fmtTs(store.ultimoRespaldo)):'nunca'}</b></div>
      <div class="btn-row">
        <button class="btn" data-act="backup">⬇️ Descargar respaldo</button>
        <button class="btn" data-act="restore">⬆️ Restaurar respaldo</button>
      </div>
      <div class="help">El respaldo es un archivo .json con todo (cuentas, historial, compromisos y ajustes). Guárdalo en Drive o mándatelo por WhatsApp. Restaurar reemplaza lo que hay en este teléfono.</div>
      <input type="file" id="restFile" style="display:none">
    </div>
    <div class="section"><div class="field-label">Corregir cargas</div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn" data-act="undo-import" ${hayDeshacer()?'':'disabled'}>↩️ Deshacer última carga</button>
        <button class="btn danger" data-act="borrar-todo">🗑 Borrar todas las cuentas</button>
      </div>
      <div class="help">“Deshacer” regresa todo a como estaba antes de la última vez que pegaste o cargaste cuentas. “Borrar todas” deja la app vacía (tus ajustes y plantillas se quedan).</div>
    </div>
    <div class="section kv">Versión <b>${APP_VERSION}</b> · datos v${store.schema}<br>Tus cuentas nunca salen de este teléfono.</div>
    <div class="btn-row"><button class="btn" data-act="sheet-close">Cerrar</button></div>`);
  $('restFile').addEventListener('change', onRestoreFile);
}
function saveAjustes(){
  const nombre = $('ajNombre').value.trim(), dia = $('ajDia').value.trim(), mora = $('ajMora').value.trim();
  const tdia = $('ajTDia').value.trim(), tmora = $('ajTMora').value.trim();
  if(!nombre || !dia || !mora || !tdia || !tmora){ toast('No dejes campos vacíos'); return; }
  Object.assign(store.ajustes, {nombre, tplDelDia:dia, tplMora:mora, tplTerceroDia:tdia, tplTerceroMora:tmora});
  saveData(); closeSheet(); render(); toast('Ajustes guardados');
}
function descargarRespaldo(){
  const now = new Date().toISOString();
  store.ultimoRespaldo = now;
  saveData();
  const payload = {app:'cobranza-gp', version:APP_VERSION, exportado:now, data:store};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `respaldo-cobranza-gp-${todayKey()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  render(); toast('Respaldo descargado');
}
async function onRestoreFile(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  e.target.value = '';
  let obj;
  try{ obj = JSON.parse(await readFileText(f)); }catch(err){ alert('Ese archivo no es un respaldo válido.'); return; }
  const data = obj && obj.data ? obj.data : obj;
  if(!data || typeof data!=='object' || !data.cuentas || typeof data.cuentas!=='object'){ alert('Ese archivo no es un respaldo de Cobranza GP.'); return; }
  const n = Object.keys(data.cuentas).length;
  const fecha = obj.exportado ? fmtTs(obj.exportado) : 'fecha desconocida';
  if(!confirm(`Restaurar respaldo del ${fecha} con ${n} cuentas.\n\nEsto REEMPLAZA lo que hay ahora en el teléfono (${cuentasList().length} cuentas). ¿Continuar?`)) return;
  try{ localStorage.setItem(STORE_KEY+'_antes_restaurar', JSON.stringify(store)); }catch(_){}
  store = migrate(data);
  saveData(); closeSheet(); clearRoute(); render(); toast(`Respaldo restaurado: ${n} cuentas`);
}

/* ---------- Copiar dirección (igual que antes) ---------- */
function copyAddr(btn, txt){
  const ok = ()=>{ btn.textContent = 'Copiado ✓'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent = 'Copiar'; btn.classList.remove('done'); }, 1800); };
  const fallback = ()=>{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ btn.textContent = 'Mantén presionado'; }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, fallback);
  else fallback();
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'toggle':
      if(openDetails.has(id)) openDetails.delete(id); else openDetails.add(id);
      { const card = el.closest('.card'); const d = card && card.querySelector('.detail');
        if(d){ const o = openDetails.has(id); d.classList.toggle('open', o); card.classList.toggle('open', o); } }
      break;
    case 'collapse': {
      openDetails.delete(id);
      const card = document.getElementById('card-'+id);
      if(card){
        card.classList.remove('open'); const d = card.querySelector('.detail'); if(d) d.classList.remove('open');
        const top = card.getBoundingClientRect().top + window.scrollY - ($('filters').offsetHeight + 8);
        window.scrollTo({top, behavior:'smooth'});
      }
      break; }
    case 'tel-add': openTelAdd(id); break;
    case 't-quien':
      tQuien = el.dataset.q;
      document.querySelectorAll('#tQuien button').forEach(b=>b.classList.toggle('on', b===el));
      break;
    case 't-save': saveTel(id); break;
    case 'tel-usar': usarTel(id, el.dataset.num); break;
    case 'assign': {
      e.stopPropagation();
      const c = store.cuentas[id]; c.assign = cycleAssign(c.assign||''); c.actualizado = new Date().toISOString();
      saveData(); render(); break; }
    case 'copy': copyAddr(el, store.cuentas[id].direccion); break;
    case 'wa':   setTimeout(()=>openGestion(id,'WhatsApp',true), 700); break;   // el enlace se abre normal
    case 'call': setTimeout(()=>openGestion(id,'Llamada',true), 700); break;
    case 'gestion': openGestion(id,'Llamada',false); break;
    case 'g-tipo':
      gState.tipo = el.dataset.t;
      document.querySelectorAll('#gTipos button').forEach(b=>b.classList.toggle('on', b===el));
      break;
    case 'g-save': saveGestion(); break;
    case 'compromiso': openCompromiso(id); break;
    case 'c-save': saveCompromiso(id); break;
    case 'plan': openPlan(id); break;
    case 'p-add': case 'p-del': case 'p-resto': planAction(act, el); break;
    case 'p-save': savePlan(false); break;
    case 'p-save-wa': savePlan(true); break;
    case 'plan-cancelar': cancelarPlan(id, el.dataset.pid); break;
    case 'plan-reenviar': reenviarPlan(id, el.dataset.pid); break;
    case 'comp-close': closeComp(id, el.dataset.cid, el.dataset.estado); break;
    case 'archivar': openArchivar(id); break;
    case 'a-motivo':
      aMotivo = el.dataset.m;
      document.querySelectorAll('#aMotivos button').forEach(b=>b.classList.toggle('on', b===el));
      break;
    case 'a-save': saveArchivar(id); break;
    case 'restaurar': {
      const c = store.cuentas[id]; const now = new Date().toISOString();
      c.historial.unshift({id:uid(), ts:now, tipo:'Archivo', auto:true, resultado:'Restaurada a seguimiento', comentario:''});
      c.archivada = null; saveData(); render(); toast('Cuenta restaurada'); break; }
    case 'undo-import': deshacerCarga(); break;
    case 'undo-hide': undoInfo = null; render(); break;
    case 'borrar-todo': borrarTodo(); break;
    case 'borrar': {
      const c = store.cuentas[id];
      if(confirm(`¿Borrar DEFINITIVAMENTE a ${properCase(c.cliente)} (#${c.id})?\n\nSe pierde su historial y compromisos. No se puede deshacer.`)){
        delete store.cuentas[id]; openDetails.delete(id); saveData(); if(sheetOpen) closeSheet(); render(); toast('Cuenta borrada');
      }
      break; }
    case 'filtro': filtro = el.dataset.f; clearRoute(); render(); window.scrollTo({top:0}); break;
    case 'optimize': runOptimize(); break;
    case 'open-import': openImport(); break;
    case 'imp-file': $('impFile').click(); break;
    case 'imp-analyze': analyzeImport(); break;
    case 'imp-save': saveImport(); break;
    case 'open-ajustes': openAjustes(); break;
    case 'aj-save': saveAjustes(); break;
    case 'aj-default':
      $('ajNombre').value = DEFAULT_AJUSTES.nombre; $('ajDia').value = DEFAULT_AJUSTES.tplDelDia; $('ajMora').value = DEFAULT_AJUSTES.tplMora;
      $('ajTDia').value = DEFAULT_AJUSTES.tplTerceroDia; $('ajTMora').value = DEFAULT_AJUSTES.tplTerceroMora;
      toast('Textos originales puestos — falta Guardar'); break;
    case 'backup': descargarRespaldo(); break;
    case 'restore': $('restFile').click(); break;
    case 'sheet-close': closeSheet(); break;
  }
});
document.addEventListener('change', e=>{
  const el = e.target;
  if(pState && el.id==='pCond'){ planInput(el); return; }
  if(el.dataset.chg==='visita'){
    const c = store.cuentas[el.dataset.id]; c.visita = el.value; c.actualizado = new Date().toISOString();
    saveData(); render();
  }
});
$('oficinaSel').addEventListener('change', e=>{ oficinaSel = e.target.value; clearRoute(); render(); });
let searchT;
$('searchIn').addEventListener('input', e=>{
  clearTimeout(searchT);
  searchT = setTimeout(()=>{ busqueda = e.target.value; clearRoute(); render(); }, 200);
});
const obsTimers = {};
document.addEventListener('input', e=>{
  const el = e.target;
  if(pState && el.closest && el.closest('#sheet') && (el.id==='pTotal'||el.id==='pNota'||el.dataset.pm!==undefined||el.dataset.pf!==undefined)){ planInput(el); return; }
  if(el.dataset.inp!=='obs') return;
  const id = el.dataset.id, c = store.cuentas[id];
  c.obs = el.value;
  clearTimeout(obsTimers[id]);
  obsTimers[id] = setTimeout(()=>{
    c.obsAt = (c.obs||'').trim() ? nowStr() : '';
    saveData();
    const strip = document.getElementById('note-'+id);
    if(strip) strip.outerHTML = stripHtml(c);
    const hint = document.getElementById('hint-'+id);
    if(hint){ hint.textContent = 'Guardado ' + nowStr(); hint.classList.add('ok'); }
  }, 500);
});
// Al volver a la app después de medianoche, recalcula "vence hoy" / días sin gestión.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !sheetOpen) render(); });

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
