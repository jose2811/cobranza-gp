<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cobranza GP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-180.png">
<style>
  :root{
    --bg:#0f1417; --card:#171e22; --card-border:#232c31;
    --ink:#e9edee; --ink-dim:#8fa0a6; --ink-faint:#5c6b70;
    --accent:#ff8a3d; --ok:#4fb477; --ok-bg:#16241c;
    --warn:#e0b23d; --warn-bg:#26200f; --bad:#e0603d; --bad-bg:#271711;
    --blue:#6fa8e8; --blue-bg:rgba(76,145,224,.14);
    --neutral-bg:#1c2327; --divider:#232c31; --radius:14px;
    --font-num:'SF Mono','Roboto Mono',monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom));}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  header{padding:16px 16px 10px;}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  h1{margin:2px 0 0;font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .sub{color:var(--ink-dim);font-size:12.5px;margin-top:3px;}
  .head-btns{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{background:var(--neutral-bg);border:1px solid var(--card-border);color:var(--ink);
    border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;}
  .icon-btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1006;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .stat{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:9px 10px;}
  .stat .v{font-family:var(--font-num);font-size:15px;font-weight:700;}
  .stat .l{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .stat.bad .v{color:var(--bad);} .stat.warn .v{color:var(--warn);}

  .banner{margin-top:10px;background:var(--warn-bg);border:1px solid rgba(224,178,61,.35);color:var(--warn);
    border-radius:10px;padding:9px 12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .banner button{background:var(--warn);color:#1a1406;border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;flex:0 0 auto;}

  .search-row{display:flex;gap:8px;margin-top:10px;}
  .search-row input,.search-row select{background:var(--neutral-bg);border:1px solid var(--card-border);color:var(--ink);
    border-radius:10px;padding:10px 12px;font-size:14px;min-width:0;}
  .search-row input{flex:1.4;}
  .search-row select{flex:1;appearance:none;-webkit-appearance:none;}

  .route-bar{display:flex;gap:8px;margin-top:10px;}
  .route-btn{
    flex:1; background:var(--neutral-bg); border:1px solid var(--card-border);
    color:var(--ink); border-radius:10px; padding:10px 8px; font-size:12.5px;
    font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px;
    text-decoration:none;
  }
  .route-btn.primary{ background:var(--accent); border-color:var(--accent); color:#1a1006; }
  .route-btn.disabled{opacity:.4;pointer-events:none;}
  .route-btn .ic{ font-size:16px; }
  .route-info{ font-size:11px; color:var(--ink-faint); margin-top:8px; text-align:center; display:none;}
  .route-info.show{ display:block; }

  .filters{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    padding:10px 16px;background:rgba(15,20,23,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--divider);}
  .filters::-webkit-scrollbar{display:none;}
  .af-btn{flex:0 0 auto;background:transparent;border:1px solid var(--card-border);color:var(--ink-dim);
    border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .af-btn .n{font-family:var(--font-num);font-size:11px;opacity:.75;margin-left:4px;}
  .af-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1006;}

  main{padding:14px;display:flex;flex-direction:column;gap:12px;}
  .empty{text-align:center;color:var(--ink-dim);font-size:13.5px;padding:40px 16px;line-height:1.5;}
  .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px;}
  .empty button{margin-top:14px;}

  .card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;}
  .card.st-visitado{border-color:rgba(79,180,119,.35);}
  .card.st-norep{border-color:rgba(224,96,61,.35);}
  .card.st-reprog{border-color:rgba(224,178,61,.35);}
  .card.archived{opacity:.85;}

  .order-badge{
    display:none;
    width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1a1006;
    font-size:12.5px;font-weight:800;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .order-badge.show{ display:flex; }

  .card-top{padding:13px 14px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer;}
  .top-left{ display:flex; gap:10px; align-items:flex-start; min-width:0; }
  .name-block{min-width:0;}
  .cliente-name{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.005em;word-break:break-word;}
  .meta-row{margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);}
  .meta-row span.id{font-family:var(--font-num);color:var(--ink-faint);}

  .badges{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:0 0 auto; }
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;}
  .pill.cartera-mora{ background:var(--bad-bg); color:var(--bad); }
  .pill.cartera-deldia{ background:var(--neutral-bg); color:var(--ink-dim); }
  .pill.visita-pendiente{ background:var(--neutral-bg); color:var(--ink-dim); }
  .pill.visita-visitado{ background:var(--ok-bg); color:var(--ok); }
  .pill.visita-norep{ background:var(--bad-bg); color:var(--bad); }
  .pill.visita-reprog{ background:var(--warn-bg); color:var(--warn); }

  .assign-chip{
    font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:5px 10px;border-radius:8px;white-space:nowrap;border:1px solid var(--card-border);
    background:var(--neutral-bg);color:var(--ink-faint);
  }
  .assign-chip.yo{ background:rgba(255,138,61,.14); border-color:rgba(255,138,61,.5); color:var(--accent); }
  .assign-chip.gerente{ background:var(--blue-bg); border-color:rgba(76,145,224,.5); color:var(--blue); }

  .flags{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 11px;}
  .flag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--neutral-bg);color:var(--ink-dim);white-space:nowrap;}
  .flag.warn{background:var(--warn-bg);color:var(--warn);}
  .flag.bad{background:var(--bad-bg);color:var(--bad);}
  .flag.ok{background:var(--ok-bg);color:var(--ok);}

  .nums{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--divider);background:rgba(255,255,255,.015);}
  .num-box{padding:9px 2px;text-align:center;border-right:1px solid var(--divider);}
  .num-box:last-child{border-right:none;}
  .num-box .val{font-family:var(--font-num);font-size:11.5px;font-weight:600;}
  .num-box .lbl{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .num-box.atraso .val{color:var(--bad);}
  .num-box.hay-multa .val{color:var(--warn);}
  .act-btn.disabled{opacity:.35;pointer-events:none;}
  .addr-line.vacio{color:var(--ink-faint);font-style:italic;}

  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--divider);border-top:1px solid var(--divider);}
  .actions.four{grid-template-columns:repeat(4,1fr);}
  .act-btn{background:var(--card);color:var(--ink);padding:11px 4px;text-align:center;font-size:12px;font-weight:600;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;gap:3px;border:none;}
  .act-btn .ic{font-size:17px;line-height:1;}
  .act-btn.call{color:var(--ok);}
  .act-btn.wa{color:#25d366;}
  .act-btn.nav{color:var(--accent);}
  .act-btn.sec{color:var(--ink-dim);font-size:11.5px;}
  .act-btn.danger{color:var(--bad);}

  .note-strip{display:none;padding:9px 14px;border-top:1px solid var(--divider);background:rgba(255,138,61,.08);
    font-size:12.5px;color:var(--ink);line-height:1.35;cursor:pointer;align-items:flex-start;gap:8px;}
  .note-strip.show{display:flex;}
  .note-strip .ni{flex:0 0 auto;}
  .note-strip .nt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    white-space:pre-wrap;word-break:break-word;}
  .note-strip .nh{flex:0 0 auto;color:var(--ink-faint);font-size:11px;font-family:var(--font-num);}

  .arch-strip{padding:9px 14px;border-top:1px solid var(--divider);background:var(--neutral-bg);font-size:12.5px;color:var(--ink-dim);}
  .arch-strip b{color:var(--ink);}

  .detail{display:none;padding:12px 14px 14px;border-top:1px solid var(--divider);background:rgba(0,0,0,.12);}
  .detail.open{display:block;}

  .addr-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin-bottom:3px;}
  .addr-text{font-size:12.5px;color:var(--ink-dim);line-height:1.4;margin-bottom:12px;}

  .addr-card{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 14px;
    border-top:1px solid var(--divider);background:rgba(255,255,255,.015);}
  .addr-card .addr-body{min-width:0;}
  .addr-card .addr-label{margin-bottom:2px;}
  .addr-card .addr-line{font-size:13px;color:var(--ink);line-height:1.35;
    -webkit-user-select:text;user-select:text;word-break:break-word;}
  .copy-btn{flex:0 0 auto;background:var(--neutral-bg);border:1px solid var(--card-border);color:var(--ink-dim);
    border-radius:8px;padding:7px 11px;font-size:11.5px;font-weight:700;}
  .copy-btn.done{color:var(--ok);border-color:rgba(79,180,119,.5);}

  .field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:0 0 6px;}
  .section{margin-top:16px;}

  .status-select,.inp,textarea.obs,textarea.inp{width:100%;background:var(--neutral-bg);border:1px solid var(--card-border);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:14px;}
  .status-select{appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238fa0a6' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;}
  textarea.obs,textarea.inp{font-size:13.5px;resize:vertical;min-height:60px;line-height:1.4;}
  textarea.obs{margin-top:12px;}
  textarea.inp.big{min-height:150px;font-family:var(--font-num);font-size:12px;white-space:pre;overflow:auto;}
  .inp::placeholder,textarea.obs::placeholder{color:var(--ink-faint);}

  .save-row{display:flex;justify-content:flex-end;margin-top:8px;}
  .save-hint{font-size:11px;color:var(--ink-faint);}
  .save-hint.ok{color:var(--ok);}

  .hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .hist li{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;}
  .hist li.auto{background:transparent;border-style:dashed;color:var(--ink-dim);}
  .hist .hh{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-faint);margin-bottom:3px;}
  .hist .ht{font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
  .hist .hr{font-weight:700;color:var(--ink);}
  .hist .hc{white-space:pre-wrap;word-break:break-word;}
  .hist-empty{font-size:12.5px;color:var(--ink-faint);font-style:italic;}

  .comp{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:10px 11px;margin-bottom:8px;font-size:12.5px;}
  .comp .ct{display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .comp .cm{font-family:var(--font-num);font-weight:700;font-size:14px;}
  .comp .cn{color:var(--ink-dim);margin-top:4px;white-space:pre-wrap;word-break:break-word;}
  .comp .cb{display:flex;gap:8px;margin-top:9px;}
  .comp .cb button{flex:1;border-radius:8px;padding:8px;font-size:12.5px;font-weight:700;border:1px solid var(--card-border);background:var(--neutral-bg);}
  .comp .cb .ok{color:var(--ok);border-color:rgba(79,180,119,.45);}
  .comp .cb .no{color:var(--bad);border-color:rgba(224,96,61,.45);}

  footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,20,23,.97);backdrop-filter:blur(6px);
    border-top:1px solid var(--divider);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-faint);z-index:25;}
  footer .reset-btn{background:none;border:1px solid var(--card-border);color:var(--ink-dim);padding:6px 11px;border-radius:8px;font-size:11px;}

  /* Hojas (ventanas desde abajo) */
  .sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;}
  .sheet-wrap.open{display:flex;}
  .sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border:1px solid var(--card-border);
    border-bottom:none;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));}
  .sheet h2{margin:0;font-size:17px;}
  .sheet .sh-sub{font-size:12.5px;color:var(--ink-dim);margin-top:3px;}
  .sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--card-border);margin:0 auto 12px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1 1 auto;background:var(--neutral-bg);border:1px solid var(--card-border);color:var(--ink-dim);
    border-radius:10px;padding:9px 10px;font-size:13px;font-weight:600;}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#1a1006;}
  .btn-row{display:flex;gap:8px;margin-top:16px;}
  .btn{flex:1;border-radius:11px;padding:12px;font-size:14px;font-weight:700;border:1px solid var(--card-border);background:var(--neutral-bg);color:var(--ink);text-align:center;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1006;}
  .btn.danger{color:var(--bad);border-color:rgba(224,96,61,.45);}
  .btn:disabled{opacity:.4;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .help{font-size:11.5px;color:var(--ink-faint);line-height:1.45;margin-top:6px;}
  .prev-sum{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px;}
  .prev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto;}
  .prev-list li{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.35;}
  .prev-list li.err{border-color:rgba(224,96,61,.45);color:var(--bad);}
  .prev-list .pt{font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.05em;margin-right:6px;}
  .prev-list .pt.n{color:var(--ok);} .prev-list .pt.u{color:var(--blue);}
  .prev-list .pd{color:var(--ink-dim);}
  .kv{font-size:12.5px;color:var(--ink-dim);line-height:1.6;}
  .kv b{color:var(--ink);font-family:var(--font-num);}
  /* ---- v1.1: tarjetas compactas ---- */
  .route-btn{flex-direction:row;justify-content:center;gap:6px;padding:10px 8px;}
  .route-btn .ic{font-size:15px;}
  .c-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px 8px;cursor:pointer;}
  .c-main{flex:1;min-width:0;}
  .c-name{font-size:16px;font-weight:700;line-height:1.25;word-break:break-word;}
  .chev{display:inline-block;margin-left:6px;color:var(--ink-faint);font-weight:400;transition:transform .15s;}
  .card.open .chev{transform:rotate(90deg);}
  .c-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .c-dias{font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--bad);}
  .c-saldo{font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--ink);}
  .c-saldo small{font-family:inherit;font-weight:500;color:var(--ink-faint);font-size:11px;}
  .c-ok{font-size:12.5px;font-weight:600;color:var(--ok);}
  .c-head .assign-chip{flex:0 0 auto;}
  .c-head .order-badge{margin-top:1px;}
  .flags{padding:0 14px 11px;}
  /* Tramos de atraso: franja izquierda + etiqueta */
  .card.t-dia{border-left:5px solid var(--ok);}
  .card.t-m1{border-left:5px solid var(--warn);}
  .card.t-m8{border-left:5px solid var(--bad);}
  .pill.tramo-dia{background:var(--ok-bg);color:var(--ok);}
  .pill.tramo-m1{background:var(--warn-bg);color:var(--warn);}
  .pill.tramo-m8{background:var(--bad);color:#1a0905;}
  .card.t-m1 .c-dias{color:var(--warn);}
  .plan-row{display:grid;grid-template-columns:1.25fr 1fr auto auto;gap:6px;margin-bottom:8px;align-items:center;}
  .plan-row .inp{padding:10px 8px;font-size:13.5px;min-width:0;}
  .mini-btn.on{background:var(--accent);border-color:var(--accent);color:#1a1006;}
  .plan-sum{margin-top:10px;}
  .c-dias small.est{font-family:inherit;font-size:10px;font-weight:700;opacity:.75;}
  .card.ronda{opacity:.55;}
  .card.ronda.open{opacity:1;}
  .card.ronda .c-name::before{content:'✓ ';color:var(--ok);}
  .note-strip.last{background:rgba(111,168,232,.08);}
  .note-strip.last b{font-weight:700;color:var(--ink-dim);}
  .close-detail{display:block;width:100%;margin-top:16px;padding:13px;border-radius:11px;border:1px solid var(--card-border);
    background:var(--neutral-bg);color:var(--ink);font-size:14px;font-weight:700;}
  .plan-tag{font-size:10.5px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;}
  .btn-row.tight{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .banner.undo{background:var(--ok-bg);border-color:rgba(79,180,119,.4);color:var(--ok);}
  .banner.undo button{background:var(--ok);color:#08140c;}
  .banner button.x{background:transparent;color:inherit;padding:6px 4px;}
  .act-btn small{font-size:10px;opacity:.8;}
  .flag.blue{background:var(--blue-bg);color:var(--blue);}
  .note-strip .nt{-webkit-line-clamp:2;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .kv-grid div{background:var(--card);border:1px solid var(--card-border);border-radius:9px;padding:7px 10px;min-width:0;}
  .kv-grid div.wide{grid-column:1 / -1;}
  .kv-grid span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;}
  .kv-grid b{display:block;font-size:13.5px;font-family:var(--font-num);font-weight:600;margin-top:2px;word-break:break-word;}
  .addr-box{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
  .addr-box .addr-line{font-size:13.5px;line-height:1.4;-webkit-user-select:text;user-select:text;word-break:break-word;}
  .tel-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;margin-bottom:8px;}

<script id="core">
const APP_VERSION = '1.10.0';
// Clave FIJA del almacenamiento. NUNCA cambiarla entre versiones.
const STORE_KEY = 'cobranza_gp_datos';
// Versión de la estructura de datos guardada. Si cambia, migrate() transforma lo viejo.
// v1: inicial · v2: teléfonos agregados (telefonos/telActivo) y columnas extra (extras)
const SCHEMA = 5; // v3: fecha de vencimiento (vence) · v4: planes de pago (planes) · v5: datosAl (fecha de la última carga)
const TEL_QUIEN = ['Cliente','Familiar','Referencia','Otro'];

const GESTION_TIPOS = ['Llamada','WhatsApp','Visita','Otro'];

// Mensajes que aparecen escritos al abrir WhatsApp (se pueden editar antes de enviar).
// {nombre} = primer nombre del cliente, {yo} = tu nombre. Sin montos ni días de atraso a propósito.

// Sin montos ni días de atraso. A terceros NUNCA se menciona adeudo, atraso ni pagos.
const DEFAULT_AJUSTES = {

    "{saludo} {nombre}, soy {yo} de Crediclub. Me gustaría platicar con usted sobre su crédito para ver cómo le puedo apoyar. ¿A qué hora le puedo llamar?",
    "{saludo} {nombre}, ¿cómo está? Soy {yo}, de Crediclub. Le escribo porque quiero apoyarle a ponerse al corriente con su crédito. ¿Tiene un momento para platicar?",

  tplTerceroMora: [

    "{saludo}, ¿cómo está? Soy {yo}, de Crediclub. Estoy tratando de localizar a {cliente}; ¿sería tan amable de darle mi recado para que se comunique conmigo hoy? Muchas gracias."
  ].join("\n---\n")
};
// Textos por defecto de versiones anteriores: si siguen sin editar, se cambian por los nuevos.
const OLD_DEFAULTS = {
  tplDelDia: ["Hola {nombre}, buen día. Soy {yo} de Crediclub. Le escribo para recordarle que hoy es su día de pago. Cualquier duda, con gusto le apoyo.",
    ["{saludo} {nombre}, soy {yo} de Crediclub. Le escribo para recordarle su pago, si ya lo realizó muchas gracias y omita este mensaje 🙂",
     "{saludo} {nombre}, ¿cómo está? Soy {yo}, de Crediclub. Nada más para recordarle su pago; cualquier duda aquí estoy para apoyarle.",
     "{saludo} {nombre}, le saluda {yo} de Crediclub. Le dejo el recordatorio de su pago. Que tenga excelente día."].join("\n---\n"),
    ["{saludo} {nombre}, ¿cómo está? Soy {yo}, de Crediclub. Nada más para recordarle que {cuando} le toca su pago. Cualquier cosa aquí estoy.",
     "{saludo} {nombre}, soy {yo} de Crediclub. Le recuerdo que su próximo pago es {cuando}. Si tiene alguna duda, con gusto le apoyo.",
     "{saludo} {nombre}, ¿qué tal? Soy {yo}, de Crediclub. Le dejo el recordatorio: su pago es {cuando}. ¡Muchas gracias!",
     "{saludo} {nombre}, ¿cómo está? Soy {yo}, de Crediclub. Le mando un saludo y quedo a sus órdenes para cualquier cosa que necesite con su crédito.",
     "{saludo} {nombre}, soy {yo} de Crediclub. Paso a saludarle; cualquier duda con su crédito o sus pagos, aquí estoy para apoyarle."].join("\n---\n")],
  tplMora: ["Hola {nombre}, buen día. Soy {yo} de Crediclub. Le escribo porque tengo registrado un pago pendiente en su crédito y quiero apoyarle a regularizarlo. ¿Tiene un momento para platicar?"],
  tplTerceroDia: ["Hola, buen día. Soy {yo} de Crediclub. Este número nos fue proporcionado como contacto de {cliente}. ¿Me podría apoyar pidiéndole que se comunique conmigo a este número? Muchas gracias."],
  tplTerceroMora: ["Hola, buen día. Soy {yo} de Crediclub. Este número nos fue proporcionado como referencia de {cliente} y necesito comunicarme con él/ella por un tema importante. ¿Me podría apoyar pidiéndole que me contacte a este número? Muchas gracias."]
};

// Columnas en el orden por defecto (cuando no viene encabezado) y nombres que se reconocen.
const COLS = [
  {k:'id',        alias:['saficreditoid','creditoid','idcredito','credito','safi','id']},
  {k:'status',    alias:['status','estatus','estado']},
  {k:'oficina',   alias:['oficina','sucursal']},
  {k:'cliente',   alias:['cliente','nombre','nombrecliente','nombredelcliente']},
  {k:'insoluto',  alias:['saldoinsoluto','insoluto']},
  {k:'saldo',     alias:['saldoenatraso','saldoatraso','enatraso']},
  {k:'multa',     alias:['multa','multas']},
  {k:'dias',      alias:['diasdeatraso','diasatraso','diasatr','dias']},
  {k:'pago',      alias:['numpago','numdepago','numeropago','numerodepago','nopago','pago']},
  {k:'tel',       alias:['telefono','tel','celular','telefonocelular']},
  {k:'lat',       alias:['latitud','lat']},
  {k:'lng',       alias:['longitud','lng','lon','long']},
  {k:'direccion', alias:['direcciondelnegocio','direccionnegocio','direccion']},
  // Opcional (columna 14): fecha de vencimiento del próximo pago
  {k:'vence',     alias:['fechadevencimiento','fechavencimiento','vencimiento','fechadeproximopago','fechaproximopago','proximopago',
                         'fechadepago','fechapago','fechavence','vence']},
];
const DATA_KEYS = ['status','oficina','cliente','insoluto','saldo','multa','dias','pago','tel','lat','lng','direccion','vence'];
const DATA_DEFAULTS = {status:'',oficina:'',cliente:'',insoluto:0,saldo:0,multa:0,dias:0,pago:'',tel:'',lat:null,lng:null,direccion:'',vence:''};

function normKey(s){
  return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
}
function limpia(s){ return String(s==null?'':s).replace(/[\s ]+/g,' ').trim(); }
// " $20,212.33 " -> 20212.33 ; " $-   " -> 0 ; "" -> 0 ; texto raro -> NaN
function parseMonto(s){
  let t = String(s==null?'':s).replace(/[\s $]/g,'').replace(/,/g,'');
  if(t==='' || /^-+$/.test(t)) return 0;
  let neg = false;
  const m = t.match(/^\((.*)\)$/); if(m){ t = m[1]; neg = true; }
  const n = Number(t);
  if(!Number.isFinite(n)) return NaN;
  return neg ? -n : n;
}
function parseCoord(s){
  let t = limpia(s);
  if(t==='') return null;
  if(!t.includes('.') && /^-?\d+,\d+$/.test(t)) t = t.replace(',','.');
  const n = Number(t);
  return (Number.isFinite(n) && n !== 0) ? n : null;
}
// Fecha de Excel -> 'AAAA-MM-DD'. Acepta 17/10/2026, 17/10/26, 17-10-2026, 2026-10-17, 17-oct-2026, 17 oct 2026
// y el número de serie de Excel. Formato mexicano: día/mes. '' si viene vacío; null si no se entiende.
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function parseFecha(s){
  const t = limpia(s).toLowerCase().replace(/\.$/,'');
  if(!t || t==='-') return '';
  const ok = (y,m,d)=>{
    if(y<100) y += 2000;
    const dt = new Date(y, m-1, d);
    if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
    return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  };
  let m;
  if((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ok(+m[1], +m[2], +m[3]);
  if((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){
    let d = +m[1], mo = +m[2];
    if(mo > 12 && d <= 12){ const x = d; d = mo; mo = x; } // venía mes/día
    return ok(+m[3], mo, d);
  }
  if((m = t.match(/^(\d{1,2})[\s\/\-.]*(?:de\s+)?([a-zé]{3})[a-zé]*\.?[\s\/\-.]*(?:de\s+|del\s+)?(\d{2,4})$/))){
    const mo = MESES.indexOf(m[2].replace('é','e').slice(0,3).replace('set','sep')) + 1;
    return mo ? ok(+m[3], mo, +m[1]) : null;
  }
  if(/^\d{5}$/.test(t)){ // número de serie de Excel
    const dt = new Date(Date.UTC(1899,11,30) + Number(t)*864e5);
    return ok(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate());
  }
  return null;
}
function limpiaTel(s){
  let d = String(s==null?'':s).replace(/\D/g,'');
  if(d.length===12 && d.startsWith('52')) d = d.slice(2);
  else if(d.length===13 && d.startsWith('521')) d = d.slice(3);
  return d;
}

// Lee texto separado por tabulador / coma / punto y coma, respetando comillas.
function parseTable(text, delim){
  const rows=[]; let row=[], field='', i=0, q=false;
  while(i<text.length){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } q=false; i++; continue; }
      field+=ch; i++; continue;
    }
    if(ch==='"' && field.trim()===''){ q=true; field=''; i++; continue; }
    if(ch===delim){ row.push(field); field=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=ch; i++;
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function detectDelim(text){
  const line = (text.split(/\r?\n/).find(l=>l.trim()!=='') || '');
  if(line.includes('\t')) return '\t';
  let semi=0, comma=0, q=false;
  for(const ch of line){
    if(ch==='"') q=!q;
    else if(!q && ch===';') semi++;
    else if(!q && ch===',') comma++;
  }
  return semi>comma ? ';' : ',';
}
function headerMap(cells){
  const map = {}; let hits = 0;
  cells.forEach((cell, idx)=>{
    const n = normKey(cell);
    if(!n) return;
    const col = COLS.find(c=>c.alias.includes(n));
    if(col && map[col.k]===undefined){ map[col.k] = idx; hits++; }
  });
  return {map, hits};
}

// Convierte el texto pegado o el archivo en filas con datos limpios y errores.
// Si no trae tabuladores (ej. copiado de WhatsApp en el celular) y no es un CSV válido,
// intenta leer cada fila separada por espacios con el orden estándar de columnas.
function parseInput(text){
  const normal = parseInputBase(text);
  if(String(text||'').includes('\t')) return normal;
  const okNormal = normal.filas.filter(f=>!f.errores.length).length;
  if(normal.filas.length && okNormal === normal.filas.length) return normal;
  const esp = parseEspacios(text);
  const okEsp = esp ? esp.filas.filter(f=>!f.errores.length).length : 0;
  return okEsp > okNormal ? esp : normal;
}

// Lee una fila "aplastada" (espacios en vez de tabuladores):
// ID  Status  Oficina  Cliente  $insoluto $atraso $multa  días  N de M  [teléfono] [lat lng] [dirección]
const RE_ESP = /^(\d{5,}) (Del D[ií]a|[^\s$]+) (\S+) (.+?) \$ ?(-|[\d,]*\.?\d+) \$ ?(-|[\d,]*\.?\d+) \$ ?(-|[\d,]*\.?\d+) (\d+) (\d+ ?(?:de|\/) ?\d+)(?: (.*))?$/i;
function filaEspacios(line){
  const m = limpia(line).match(RE_ESP);
  if(!m) return null;
  let rest = (m[10]||'').split(' ').filter(Boolean);
  let tel = '', lat = '', lng = '';
  if(rest.length && /^\+?\d{10,13}$/.test(rest[0])) tel = rest.shift();
  const coord = t => /^-?\d{1,3}\.\d+$/.test(t||'');
  if(coord(rest[0]) && coord(rest[1])){ lat = rest.shift(); lng = rest.shift(); }
  let dir = rest.join(' '), vence;
  const fm = dir.match(/(?:^|\s)(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}[\/\-\s][a-zA-Zé]{3,}\.?[\/\-\s]\d{2,4})$/);
  if(fm && parseFecha(fm[1])){ vence = fm[1]; dir = dir.slice(0, fm.index).trim(); }
  const cells = [m[1], m[2], m[3], m[4], '$'+m[5], '$'+m[6], '$'+m[7], m[8], m[9], tel, lat, lng, dir];
  if(vence) cells.push(vence);
  return cells;
}
function parseEspacios(text){
  const lines = String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/);
  const filas = [];
  let algun = false;
  lines.forEach((ln, i)=>{
    const t = limpia(ln);
    if(!t) return;
    if(i===0 && /safi|cliente|status/i.test(t) && !/^\d/.test(t)) return; // encabezado: se usa el orden estándar
    const cells = filaEspacios(t);
    if(!cells){ filas.push({line:i+1, data:{}, errores:['No pude separar las columnas de esta fila']}); return; }
    algun = true;
    const sub = parseInputBase(cells.join('\t'));
    const f = sub.filas[0]; f.line = i+1;
    filas.push(f);
  });
  if(!algun) return null;
  return {delim:' ', conEncabezado:false, faltan:[], filas, sinTabs:false, modoEspacios:true};
}

function parseInputBase(text){
  text = String(text||'').replace(/^﻿/,'');
  const delim = detectDelim(text);
  const raw = parseTable(text, delim);
  const rows = [];
  raw.forEach((cells, idx)=>{ if(cells.some(c=>limpia(c)!=='')) rows.push({line: idx+1, cells}); });
  const out = {delim, conEncabezado:false, faltan:[], filas:[]};
  if(!rows.length) return out;

  let idxMap; const extraCols = [];
  const h = headerMap(rows[0].cells);
  if(h.hits >= 3 && (h.map.id !== undefined || h.map.cliente !== undefined)){
    out.conEncabezado = true;
    idxMap = h.map;
    // Columnas que no son de las 13 estándar: se guardan como "Más datos" con su encabezado.
    const usados = new Set(Object.values(idxMap));
    rows[0].cells.forEach((cell, idx)=>{
      const label = limpia(cell);
      if(label && !usados.has(idx) && !extraCols.some(x=>x.label===label)) extraCols.push({idx, label});
    });
    out.extras = extraCols.map(x=>x.label);
    rows.shift();
    out.faltan = COLS.filter(c=>idxMap[c.k]===undefined && c.k!=='vence').map(c=>c.k);
  } else {
    idxMap = {}; COLS.forEach((c,i)=>{ idxMap[c.k]=i; });
  }

  const nCols = out.conEncabezado ? null : COLS.length; // 14 (la última, fecha, es opcional)
  out.sinTabs = delim !== '\t';
  rows.forEach(r=>{
    const errores = [];
    const get = k => {
      if(idxMap[k]===undefined) return undefined;
      const v = r.cells[idxMap[k]];
      if(v === undefined) return (!out.conEncabezado && k==='vence') ? undefined : ''; // sin columna 14: no tocar la fecha
      return v;
    };
    const data = {};
    // Sin encabezado deben venir exactamente las 13 columnas; si no, la fila viene corrida.
    if(nCols && r.cells.length !== nCols && r.cells.length !== nCols-1)
      errores.push(`Trae ${r.cells.length} columnas y deben ser ${nCols-1} (o ${nCols} con fecha de vencimiento) — fila corrida o mal copiada`);
    const idRaw = limpia(get('id')).replace(/\s/g,'');
    const id = idRaw.replace(/\D/g,'');
    if(!id) errores.push('Sin SafiCreditoID');
    else if(!/^\d+$/.test(idRaw)) errores.push('SafiCreditoID no es número: "'+limpia(get('id'))+'"');
    data.id = id;
    for(const k of DATA_KEYS){
      const v = get(k);
      if(v === undefined) continue; // columna no incluida en esta carga: no se toca
      if(k==='insoluto' || k==='saldo' || k==='multa'){
        const n = parseMonto(v);
        if(Number.isNaN(n)) errores.push('Monto inválido en '+k+': "'+limpia(v)+'"');
        else data[k] = Math.round(n*100)/100;
      } else if(k==='dias'){
        const n = parseMonto(v);
        if(Number.isNaN(n)) errores.push('Días de atraso inválidos: "'+limpia(v)+'"');
        else data[k] = Math.round(n);
      } else if(k==='lat' || k==='lng'){
        data[k] = parseCoord(v);
        // Rango de México: si no cae aquí, la fila casi seguro viene corrida.
        const [lo, hi] = k==='lat' ? [14, 33] : [-119, -86];
        if(data[k] !== null && (data[k] < lo || data[k] > hi)) errores.push((k==='lat'?'Latitud':'Longitud')+' fuera de México: '+limpia(v));
      } else if(k==='tel'){
        data[k] = limpiaTel(v);
      } else if(k==='vence'){
        const f = parseFecha(v);
        if(f === null) errores.push('Fecha de vencimiento no reconocida: "'+limpia(v)+'"');
        else data[k] = f;
      } else {
        data[k] = limpia(v);
      }
    }
    if(extraCols.length){
      data.extras = {};
      extraCols.forEach(x=>{ data.extras[x.label] = limpia(r.cells[x.idx]); });
    }
    if(data.cliente !== undefined && !data.cliente) errores.push('Sin nombre de cliente');
    out.filas.push({line:r.line, data, errores});
  });
  return out;
}

function money(n){ return '$' + Number(n||0).toLocaleString('es-MX', {maximumFractionDigits:0}); }

// Calcula qué pasaría al guardar (vista previa). No modifica nada.
function planMerge(store, parsed){
  const items = []; const pos = {};
  for(const f of parsed.filas){
    if(f.errores.length){ items.push({tipo:'error', line:f.line, errores:f.errores, data:f.data}); continue; }
    const id = f.data.id;
    const prev = store.cuentas[id];
    const cambios = [];
    if(prev){
      if(f.data.dias !== undefined && Number(prev.dias) !== Number(f.data.dias))
        cambios.push('Días de atraso: '+(prev.dias==null?0:prev.dias)+' → '+f.data.dias);
      if(f.data.saldo !== undefined && Number(prev.saldo) !== Number(f.data.saldo))
        cambios.push('Saldo en atraso: '+money(prev.saldo)+' → '+money(f.data.saldo));
    }
    const it = {tipo: prev ? 'actualiza' : 'nueva', line:f.line, id, data:f.data, cambios, archivada: !!(prev && prev.archivada)};
    if(pos[id] !== undefined) items[pos[id]] = it; // repetida en la misma carga: gana la última
    else { pos[id] = items.length; items.push(it); }
  }
  return {
    items,
    nuevas: items.filter(i=>i.tipo==='nueva').length,
    actualizadas: items.filter(i=>i.tipo==='actualiza').length,
    errores: items.filter(i=>i.tipo==='error').length,
  };
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function nuevaCuenta(data, nowIso){
  const c = {id:data.id};
  for(const k of DATA_KEYS) c[k] = data[k]!==undefined ? data[k] : DATA_DEFAULTS[k];
  Object.assign(c, {alta:nowIso, actualizado:nowIso, datosAl:nowIso, assign:'', visita:'pendiente', obs:'', obsAt:'',
    historial:[], compromisos:[], planes:[], archivada:null, telefonos:[], telActivo:'', extras:Object.assign({}, data.extras||{})});
  c.historial.unshift({id:uid(), ts:nowIso, tipo:'Sistema', auto:true,
    resultado:'', comentario:'Alta en seguimiento · '+(c.status||'')+' · '+c.dias+' días de atraso'});
  return c;
}

// Aplica la mezcla: agrega nuevas, actualiza existentes conservando historial/compromisos/asignación.
// Las cuentas que no vienen en la carga NO se tocan.
function applyMerge(store, plan, nowIso){
  for(const it of plan.items){
    if(it.tipo==='error') continue;
    if(it.tipo==='nueva'){ store.cuentas[it.id] = nuevaCuenta(it.data, nowIso); continue; }
    const c = store.cuentas[it.id];
    for(const k of DATA_KEYS) if(it.data[k] !== undefined) c[k] = it.data[k];
    if(it.data.extras) c.extras = Object.assign({}, c.extras||{}, it.data.extras);
    c.actualizado = nowIso; c.datosAl = nowIso;
    if(it.cambios.length){
      c.historial.unshift({id:uid(), ts:nowIso, tipo:'Sistema', auto:true, resultado:'', comentario:it.cambios.join(' · ')});
    }
  }
  return store;
}

// Deja los datos guardados (de cualquier versión) en la forma actual. Nunca borra nada.
function migrate(raw){
  const d = (raw && typeof raw==='object' && !Array.isArray(raw)) ? raw : {};
  const out = Object.assign({}, d);
  out.cuentas = (d.cuentas && typeof d.cuentas==='object') ? d.cuentas : {};
  out.ajustes = Object.assign({}, DEFAULT_AJUSTES, (d.ajustes && typeof d.ajustes==='object') ? d.ajustes : {});
  for(const k of Object.keys(OLD_DEFAULTS)) if(OLD_DEFAULTS[k].includes(out.ajustes[k])) out.ajustes[k] = DEFAULT_AJUSTES[k];
  if(!('ultimoRespaldo' in out)) out.ultimoRespaldo = null;
  const nowIso = new Date().toISOString();
  for(const key of Object.keys(out.cuentas)){
    const c = out.cuentas[key];
    if(!c || typeof c!=='object') continue;
    if(c.id == null) c.id = key;
    c.id = String(c.id);
    for(const k of DATA_KEYS) if(c[k] === undefined) c[k] = DATA_DEFAULTS[k];
    if(!Array.isArray(c.historial)) c.historial = [];
    if(!Array.isArray(c.compromisos)) c.compromisos = [];
    if(c.assign === undefined) c.assign = '';
    if(c.visita === undefined) c.visita = 'pendiente';
    if(c.obs === undefined) c.obs = '';
    if(c.archivada === undefined) c.archivada = null;
    if(!c.alta) c.alta = c.actualizado || nowIso;
    // v2: teléfonos agregados y columnas extra
    if(!Array.isArray(c.telefonos)) c.telefonos = [];
    if(c.telActivo === undefined) c.telActivo = '';
    if(!c.extras || typeof c.extras!=='object') c.extras = {};
    // v4: planes de pago
    if(!Array.isArray(c.planes)) c.planes = [];
    // v5: fecha de la última carga de datos (para estimar días de atraso)
    if(!c.datosAl) c.datosAl = c.alta;
    if(c.tel) c.tel = limpiaTel(c.tel);
  }
  // --- Aquí van las transformaciones de versiones futuras, por ejemplo:
  // if((d.schema||1) < 3){ ... }
  out.schema = SCHEMA;
  return out;
}

// Nombre propio: "JUAN PEREZ DE LA CRUZ" -> "Juan Perez de la Cruz" (solo para mostrar; no cambia los datos)
const PARTICULAS = ['de','del','la','las','los','y','e','van','von','da','di'];
function properCase(s){
  return String(s||'').trim().toLowerCase().split(/\s+/).filter(Boolean)
    .map((w,i)=> (i>0 && PARTICULAS.includes(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
function saludoHora(d){ const h = (d||new Date()).getHours(); return h<12 ? 'Buenos días' : h<19 ? 'Buenas tardes' : 'Buenas noches'; }
// "hoy" / "mañana" / "este jueves 17" / "el jueves 17 de octubre". null si no hay fecha o ya pasó.
const DIAS_SEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
/* ---------- Plan de pago ---------- */
// La condonación de multa solo se ofrece con 8+ días de atraso (a esa altura la multa ya está aplicada
// y está incluida en el saldo en atraso). Total con condonación = saldo en atraso − multa.
const DIAS_CONDONA = 8;
function puedeCondonar(c){ return (Number(c.dias)||0) >= DIAS_CONDONA && (Number(c.multa)||0) > 0; }
function planTotalSugerido(c, condona){
  const t = (Number(c.saldo)||0) - (condona && puedeCondonar(c) ? Number(c.multa)||0 : 0);
  return Math.max(0, Math.round(t*100)/100);
}
// Recalcula el pago marcado como "resto" = total − los demás. Devuelve el resto (puede ser negativo = error).
function planResto(pagos, total){
  const otros = pagos.filter(p=>!p.resto).reduce((s,p)=>s+(Number(p.monto)||0),0);
  const r = Math.round((total - otros)*100)/100;
  pagos.forEach(p=>{ if(p.resto) p.monto = r; });
  return r;
}
function money2(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-MX', {minimumFractionDigits: n%1 ? 2 : 0, maximumFractionDigits: 2});
}
function fechaPlanLbl(ymd, now){
  const [y,m,d] = String(ymd).split('-').map(Number);
  const f = new Date(y, m-1, d); now = now || new Date();
  const dif = dayDiff(now, f), dia = DIAS_SEM[f.getDay()];
  const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
  if(dif === 0) return 'Hoy ' + dia + ' ' + d;
  if(dif === 1) return 'Mañana ' + dia + ' ' + d;
  if(dif > 1 && dif <= 6) return cap(dia) + ' ' + d;
  return cap(dia) + ' ' + d + ' de ' + MESES_L[m-1];
}
// Mensaje de confirmación del plan (solo para el titular: lleva montos).
function planMensaje(c, plan, aj, now){
  const first = (c.cliente||'').trim().split(/\s+/)[0] || '';
  const nombre = first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
  const pagos = plan.pagos.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  let msg = saludoHora(now) + ' ' + nombre + ', le saluda ' + aj.nombre + ' de Crediclub. Como lo platicamos, le confirmo su plan de pagos:\n';
  msg += pagos.map(p=>'• ' + fechaPlanLbl(p.fecha, now) + ': ' + money2(p.monto)).join('\n');
  if(pagos.length > 1) msg += '\nTotal: ' + money2(plan.total) + '.';
  if(plan.condona && plan.multa > 0)
    msg += '\n\nSi cubre los pagos en las fechas acordadas, se le condona la multa de ' + money2(plan.multa) +
           '; en caso de no cumplir, la multa se mantiene.';
  msg += '\n\n¿Está de acuerdo? Quedo atento a su confirmación.';
  return msg;
}
// Estado del plan según sus compromisos.
function evaluarPlan(c, plan){
  const cs = (c.compromisos||[]).filter(x=>x.planId===plan.id);
  if(!cs.length) return 'cancelado';
  if(cs.some(x=>x.estado==='incumplido')) return 'incumplido';
  if(cs.some(x=>x.estado==='cancelado')) return 'cancelado';
  if(cs.every(x=>x.estado==='cumplido')) return 'cumplido';
  return 'activo';
}

function cuandoTexto(ymd, now){
  if(!ymd) return null;
  const [y,m,d] = String(ymd).split('-').map(Number); if(!y) return null;
  const f = new Date(y, m-1, d); now = now || new Date();
  const dif = dayDiff(now, f);
  if(dif < 0) return null;
  if(dif === 0) return 'hoy';
  if(dif === 1) return 'mañana';
  if(dif <= 6) return 'este ' + DIAS_SEM[f.getDay()] + ' ' + d;
  return 'el ' + DIAS_SEM[f.getDay()] + ' ' + d + ' de ' + MESES_L[m-1];
}
function versiones(tpl){ return String(tpl||'').split(/\n[ \t]*-{3,}[ \t]*\n/).map(x=>x.trim()).filter(Boolean); }
// WhatsApp: wa.me/52 + 10 dígitos, sin guardar contacto; plantilla según status (Mora / al corriente) y si es titular o tercero.
function waUrl(c, aj, tercero, opts){
  opts = opts || {};
  const num = String(c.tel||'').replace(/\D/g,'');
  if(num.length !== 10) return null;
  const first = (c.cliente||'').trim().split(/\s+/)[0] || '';
  const nombre = first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
  const mora = (c.status||'').toLowerCase().includes('mora');
  const tpl = tercero ? (mora ? aj.tplTerceroMora : aj.tplTerceroDia) : (mora ? aj.tplMora : aj.tplDelDia);
  let vs = versiones(tpl); if(!vs.length) return null;
  const cuando = cuandoTexto(c.vence, opts.now);
  // Con fecha vigente se prefieren las versiones que la mencionan; sin fecha, las que no.
  const conF = vs.filter(v=>v.includes('{cuando}')), sinF = vs.filter(v=>!v.includes('{cuando}'));
  if(cuando && conF.length) vs = conF; else if(!cuando && sinF.length) vs = sinF;
  const rnd = opts.rnd || Math.random;
  const msg = vs[Math.floor(rnd()*vs.length) % vs.length]
    .split('{cuando}').join(cuando || 'pronto')
    .split('{saludo}').join(saludoHora(opts.now))
    .split('{nombre}').join(nombre)
    .split('{cliente}').join(properCase(c.cliente))
    .split('{yo}').join(aj.nombre);
  return 'https://wa.me/52' + num + '?text=' + encodeURIComponent(msg);
}

// Teléfono que se usa para llamar y WhatsApp: el agregado "en uso" o, si no hay, el de la lista.
function telActivo(c){ return c.telActivo || c.tel || ''; }
// Número para la app de teléfono: solo los 10 dígitos, sin +52.
// ¿El teléfono en uso es de alguien que no es el titular? (familiar, referencia, otro)
function esTercero(c){
  if(!c.telActivo) return false;
  const t = (c.telefonos||[]).find(x=>x.num===c.telActivo);
  return !!(t && t.quien && t.quien!=='Cliente');
}
function telMarcar(n){ return limpiaTel(n); }
function fmtTel(n){ const d = limpiaTel(n); return d.length===10 ? d.slice(0,2)+' '+d.slice(2,6)+' '+d.slice(6) : d; }

function pad2(n){ return String(n).padStart(2,'0'); }
function todayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayDiff(from, to){ return Math.round((startOfDay(to) - startOfDay(from)) / 864e5); }

function ultimaGestion(c){ return (c.historial||[]).find(h=>GESTION_TIPOS.includes(h.tipo)) || null; }
// "Ronda": una cuenta gestionada en las últimas RONDA_HORAS horas cuenta como atendida
// (se atenúa y baja al final de la lista). Pensado para 2 rondas al día.
const RONDA_HORAS = 3;
function atendidaRonda(c, now){
  const g = ultimaGestion(c); if(!g) return false;
  const t = new Date(g.ts); if(isNaN(t)) return false;
  return ((now || new Date()) - t) < RONDA_HORAS * 36e5;
}
function cuandoCorto(iso, now){
  const d = new Date(iso); if(isNaN(d)) return '';
  now = now || new Date();
  const hora = d.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
  const dd = dayDiff(d, now);
  if(dd === 0) return 'hoy ' + hora;
  if(dd === 1) return 'ayer ' + hora;
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}) + ' ' + hora;
}
function diasSinGestion(c, now){
  const g = ultimaGestion(c);
  const ref = g ? g.ts : c.alta;
  const d = new Date(ref);
  if(isNaN(d)) return 0;
  return Math.max(0, dayDiff(d, now || new Date()));
}
function compPendientes(c){
  return (c.compromisos||[]).filter(x=>x.estado==='pendiente').sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
}
function compEstado(comp, hoy){
  if(comp.estado!=='pendiente') return comp.estado;
  if(comp.fecha < hoy) return 'vencido';
  if(comp.fecha === hoy) return 'hoy';
  return 'futuro';
}
// Días de atraso estimados: los días de la última carga + los días que han pasado,
// porque si la cuenta sigue en seguimiento es que no se ha resuelto.
// - Del día con fecha de vencimiento: empieza a contar después de esa fecha.
// - Se detiene si se registró un pago después de la carga (gestión "Pagó" o compromiso cumplido).
function pagoRegistrado(c){
  const base = new Date(c.datosAl || c.alta || 0);
  return (c.historial||[]).some(h => new Date(h.ts) > base &&
    ((GESTION_TIPOS.includes(h.tipo) && h.resultado==='Pagó') || (h.tipo==='Compromiso' && h.resultado==='Cumplido')));
}
function diasEstimados(c, now){
  const d = Number(c.dias)||0;
  if(c.archivada || pagoRegistrado(c)) return d;
  now = now || new Date();
  const carga = new Date(c.datosAl || c.alta);
  if(isNaN(carga)) return d;
  if(d === 0){
    if(c.vence){
      const [y,m,dd] = String(c.vence).split('-').map(Number);
      return y ? Math.max(0, dayDiff(new Date(y, m-1, dd), now)) : 0;
    }
    return Math.max(0, dayDiff(carga, now));
  }
  return d + Math.max(0, dayDiff(carga, now));
}
// Copia de la cuenta con días/estatus estimados para mostrar (no cambia lo guardado).
function efectiva(c, now){
  const est = diasEstimados(c, now), d = Number(c.dias)||0;
  if(est === d) return c;
  return Object.assign({}, c, {dias:est, diasCargados:d, diasEst:true,
    status: est > 0 && !normKey(c.status).includes('mora') ? 'Mora' : c.status});
}
function esMora(c){ return normKey(c.status).includes('mora'); }
// Tramo de atraso para el color de la tarjeta: 'dia' (0 días), 'm1' (1-7), 'm8' (8 o más).
// Si el status dice Mora pero trae 0 días, se trata como 1-7.
function tramo(c){
  const d = Number(c.dias)||0;
  if(d >= 8) return 'm8';
  if(d >= 1 || esMora(c)) return 'm1';
  return 'dia';
}
const TRAMO_LBL = {dia:'Del día', m1:'Mora 1-7', m8:'Mora 8+'};
function esDelDia(c){ return normKey(c.status).includes('deldia') || normKey(c.status)==='dia'; }

function haversine(a,b){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function hasCoords(c){ return Number.isFinite(c.lat) && Number.isFinite(c.lng) && !(c.lat===0 && c.lng===0); }

const ASSIGN_OPTS = [
  {v:'', label:'Sin asignar', cls:''},
  {v:'yo', label:'Yo', cls:'yo'},
  {v:'gerente', label:'Gerente', cls:'gerente'},
];
function assignMeta(v){ return ASSIGN_OPTS.find(a=>a.v===v) || ASSIGN_OPTS[0]; }
function cycleAssign(v){ const i = ASSIGN_OPTS.findIndex(a=>a.v===v); return ASSIGN_OPTS[(i+1)%ASSIGN_OPTS.length].v; }
function navUrl(lat,lng){ return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`; }

function diasParaPago(c){
  if(!c.vence) return null;
  const [y,m,d] = String(c.vence).split('-').map(Number); if(!y) return null;
  return dayDiff(new Date(), new Date(y, m-1, d));
}
function pagaPronto(c){ const n = diasParaPago(c); return n !== null && n >= 0 && n <= 3; }
function baseList(){
  const q = normKey(busqueda);
  return cuentasList().filter(c=>{
    if(oficinaSel && c.oficina !== oficinaSel) return false;
    if(q && !(normKey(c.cliente).includes(q) || String(c.id).includes(q))) return false;
    return true;
  });
}
function visibleList(){
  const hoy = todayKey();
  const f = FILTROS.find(x=>x.k===filtro) || FILTROS[0];
  const list = baseList().filter(c=>f.fn(c, hoy));
  list.sort((a,b)=> (Number(b.dias)||0)-(Number(a.dias)||0) || (Number(b.saldo)||0)-(Number(a.saldo)||0) ||
    String(a.vence||'9999').localeCompare(String(b.vence||'9999')) || String(a.cliente).localeCompare(String(b.cliente)));
  // Las atendidas en esta ronda bajan al final (sin perder su orden entre ellas).
  if(!routeOrder && filtro!=='archivadas'){
    const now = new Date();
    list.sort((a,b)=>(atendidaRonda(a,now)?1:0)-(atendidaRonda(b,now)?1:0));
  }
  if(routeOrder && filtro!=='archivadas'){
    const pos = new Map(routeOrder.map((id,i)=>[id,i]));
    list.sort((a,b)=>(pos.has(a.id)?pos.get(a.id):1e9)-(pos.has(b.id)?pos.get(b.id):1e9));
  }
  return list;
}

/* ---------- Ruta ---------- */
const MAX_PARADAS_MAPS = 10;
function buildMapsAllUrl(list){
  const pts = list.filter(hasCoords).slice(0, MAX_PARADAS_MAPS).map(c=>`${c.lat},${c.lng}`);
  if(!pts.length) return null;
  const destination = pts[pts.length-1];
  const waypoints = pts.slice(0,-1).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=driving`;
  if(waypoints) url += `&waypoints=${encodeURIComponent(waypoints)}`;
  return url;
}
function runOptimize(){
  const info = $('routeInfo');
  const list = visibleList().filter(c=>!c.archivada);
  const withC = list.filter(hasCoords);
  if(!withC.length){ info.textContent = 'Ninguna cuenta de esta vista tiene coordenadas para armar la ruta.'; info.classList.add('show'); return; }
  const go = (start)=>{
    const pending = withC.slice(); const order = []; let cur = start, totalKm = 0;
    while(pending.length){
      let bi=0, bd=Infinity;
      pending.forEach((c,i)=>{ const d=haversine(cur,c); if(d<bd){bd=d;bi=i;} });
      const ch = pending.splice(bi,1)[0]; order.push(ch.id); totalKm += bd; cur = {lat:ch.lat,lng:ch.lng};
    }
    const sin = list.length - withC.length;
    routeOrder = order.concat(list.filter(c=>!hasCoords(c)).map(c=>c.id));
    info.textContent = `Ruta sugerida: ${order.length} paradas · ~${totalKm.toFixed(1)} km en línea recta (el tráfico real puede variar)` +
      (sin ? ` · ${sin} sin ubicación al final` : '') +
      (order.length > MAX_PARADAS_MAPS ? ` · Google Maps abre solo las primeras ${MAX_PARADAS_MAPS}` : '');
    info.classList.add('show');
    render();
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => go({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      ()  => go({lat:withC[0].lat, lng:withC[0].lng}),
      {timeout:4000}
    );
  } else go({lat:withC[0].lat, lng:withC[0].lng});
}
function clearRoute(){ routeOrder = null; $('routeInfo').classList.remove('show'); }

/* ---------- Tarjetas ---------- */
function histHtml(c){
  if(!c.historial.length) return '<div class="hist-empty">Sin gestiones registradas.</div>';
  return '<ul class="hist">' + c.historial.map(h=>`
    <li class="${h.auto?'auto':''}">
      <div class="hh"><span class="ht">${esc(h.tipo)}</span><span>${esc(fmtTs(h.ts))}</span></div>
      ${h.resultado?`<div class="hr">${esc(h.resultado)}</div>`:''}
      ${h.comentario?`<div class="hc">${esc(h.comentario)}</div>`:''}
    </li>`).join('') + '</ul>';
}
function compHtml(c, hoy){
  const all = (c.compromisos||[]).slice().sort((a,b)=>{
    const pa = a.estado==='pendiente'?0:1, pb = b.estado==='pendiente'?0:1;
    return pa-pb || (a.fecha<b.fecha?-1:1);
  });
  if(!all.length) return '<div class="hist-empty">Sin compromisos.</div>';
  return all.map(x=>{
    const st = compEstado(x, hoy);
    const tag = st==='hoy' ? '<span class="flag warn">Vence hoy</span>'
      : st==='vencido' ? '<span class="flag bad">Vencido</span>'
      : st==='cumplido' ? '<span class="flag ok">Cumplido</span>'
      : st==='incumplido' ? '<span class="flag bad">Incumplido</span>'
      : st==='cancelado' ? '<span class="flag">Cancelado</span>'
      : '<span class="flag">Pendiente</span>';
    return `<div class="comp">
      <div class="ct"><span><span class="cm">${esc(money2(x.monto))}</span> · ${esc(fmtFecha(x.fecha))}${x.planId?' · <span class="plan-tag">Plan</span>':''}</span>${tag}</div>
      ${x.nota?`<div class="cn">${esc(x.nota)}</div>`:''}
      ${x.estado==='pendiente'?`<div class="cb">
        <button class="ok" data-act="comp-close" data-id="${esc(c.id)}" data-cid="${esc(x.id)}" data-estado="cumplido">✓ Cumplido</button>
        <button class="no" data-act="comp-close" data-id="${esc(c.id)}" data-cid="${esc(x.id)}" data-estado="incumplido">✕ Incumplido</button>
      </div>`:''}
    </div>`;
  }).join('');
}
function planesHtml(c){
  const pa = (c.planes||[]).find(p=>p.estado==='activo');
  if(!pa) return '';
  const cs = c.compromisos.filter(x=>x.planId===pa.id), hechos = cs.filter(x=>x.estado==='cumplido').length;
  return `<div class="section"><div class="field-label">Plan de pago activo</div>
    <div class="comp">
      <div class="ct"><span><span class="cm">${esc(money2(pa.total))}</span> · ${cs.length} pagos · ${hechos} cumplidos</span><span class="flag blue">Activo</span></div>
      ${pa.condona&&pa.multa>0?`<div class="cn">Condona multa de ${esc(money2(pa.multa))} si cumple todos los pagos.</div>`:''}
      <div class="cb">
        <button data-act="plan-reenviar" data-id="${esc(c.id)}" data-pid="${esc(pa.id)}">💬 Reenviar</button>
        <button class="no" data-act="plan-cancelar" data-id="${esc(c.id)}" data-pid="${esc(pa.id)}">Cancelar plan</button>
      </div>
    </div></div>`;
}
// Cintilla de la tarjeta: lo último que pasó (última gestión). Si no hay, la nota fija.
function stripHtml(c){
  const id = esc(c.id);
  const g = ultimaGestion(c);
  if(g){
    const ic = {Llamada:'📞', WhatsApp:'💬', Visita:'🚶', Otro:'📝'}[g.tipo] || '📝';
    const txt = [g.resultado, g.comentario].filter(Boolean).join(' — ');
    return `<div class="note-strip show last" id="note-${id}" data-act="toggle" data-id="${id}"><span class="ni">${ic}</span>
      <span class="nt"><b>${esc(cuandoCorto(g.ts))} · ${esc(g.tipo)}</b>${txt?' · '+esc(txt):''}</span></div>`;
  }
  const obs = (c.obs||'').trim();
  return `<div class="note-strip ${obs?'show':''}" id="note-${id}" data-act="toggle" data-id="${id}"><span class="ni">📝</span><span class="nt">${esc(obs)}</span></div>`;
}
function flagsHtml(c, hoy){
  const out = [];
  const dsg = diasSinGestion(c);
  const g = ultimaGestion(c);
  if(g && dsg===0) out.push(`<span class="flag ok">✓ Gestionada ${esc(cuandoCorto(g.ts))}</span>`);
  else if(!g && dsg===0) out.push(`<span class="flag">Nueva · sin gestión</span>`);
  else out.push(`<span class="flag ${dsg>=3?'warn':''}">⏱ ${dsg} ${dsg===1?'día':'días'} sin gestión</span>`);
  const p = compPendientes(c)[0];
  if(p){
    const st = compEstado(p, hoy);
    if(st==='vencido') out.push(`<span class="flag bad">🤝 Vencido ${esc(fmtFecha(p.fecha))} · ${esc(fmtMoney(p.monto))}</span>`);
    else if(st==='hoy') out.push(`<span class="flag warn">🤝 Vence hoy · ${esc(fmtMoney(p.monto))}</span>`);
    else out.push(`<span class="flag">🤝 ${esc(fmtFecha(p.fecha))} · ${esc(fmtMoney(p.monto))}</span>`);
  }
  const pa = (c.planes||[]).find(p=>p.estado==='activo');
  if(pa){
    const cs = c.compromisos.filter(x=>x.planId===pa.id), hechos = cs.filter(x=>x.estado==='cumplido').length;
    out.push(`<span class="flag blue">📋 Plan ${hechos}/${cs.length}${pa.condona&&pa.multa>0?' · condona '+esc(money2(pa.multa)):''}</span>`);
  }
  const dp = diasParaPago(c);
  if(dp !== null && dp >= 0 && dp <= 6){
    const [y,m,d] = c.vence.split('-').map(Number);
    const dia = DIAS_SEM[new Date(y,m-1,d).getDay()].slice(0,3);
    out.push(`<span class="flag ${dp===0?'warn':dp===1?'blue':''}">📅 ${dp===0?'Paga hoy':dp===1?'Paga mañana':'Paga '+dia+' '+d}</span>`);
  }
  if(c.telActivo){
    const t = (c.telefonos||[]).find(x=>x.num===c.telActivo);
    out.push(`<span class="flag blue">📱 Tel. agregado${t&&t.quien?' · '+esc(t.quien):''}</span>`);
  }
  if(c.visita && c.visita!=='pendiente'){
    const v = statusMeta(c.visita);
    out.push(`<span class="flag ${v.cls==='visita-visitado'?'ok':v.cls==='visita-norep'?'bad':'warn'}">${esc(v.label)}</span>`);
  }
  return `<div class="flags">${out.join('')}</div>`;
}

      <input class="inp" id="tNota" style="margin-top:8px" placeholder="Nombre o parentesco (ej. hija, vecino del local)"></div>

    </div>`);

function saveTel(id){
  const c = store.cuentas[id]; if(!c) return closeSheet();
  const num = limpiaTel($('tNum').value);
  if(num.length!==10){ toast('El número debe tener 10 dígitos'); return; }
  const nota = $('tNota').value.trim(), usar = $('tUsar').checked;
  const now = new Date().toISOString();
  if(num !== c.tel && !c.telefonos.some(t=>t.num===num)) c.telefonos.push({id:uid(), num, quien:tQuien, nota, ts:now});
  if(usar) c.telActivo = (num===c.tel) ? '' : num;
  c.historial.unshift({id:uid(), ts:now, tipo:'Teléfono', auto:true, resultado:'Teléfono agregado',
    comentario:`${fmtTel(num)} · ${tQuien}${nota?' ('+nota+')':''}${usar?' · ahora en uso':''}`});
  saveData(); closeSheet(); render(); toast('Teléfono guardado');
}
function usarTel(id, num){
  const c = store.cuentas[id]; if(!c) return;
  c.telActivo = num || '';
  c.historial.unshift({id:uid(), ts:new Date().toISOString(), tipo:'Teléfono', auto:true, resultado:'Cambio de teléfono en uso',
    comentario: fmtTel(telActivo(c)) + (num?'':' (original de la lista)')});
  saveData(); render(); toast('Teléfono en uso: ' + fmtTel(telActivo(c)));
}

function render(){
  const hoy = todayKey();
  const all = cuentasList();
  const base = baseList();
  const list = visibleList();
  const activas = list.filter(c=>!c.archivada);

  $('verLbl').textContent = 'v' + APP_VERSION;
  $('stCuentas').textContent = list.length;
  $('stAtraso').textContent = fmtMoney(activas.reduce((s,c)=>s+(Number(c.saldo)||0),0));
  $('stHoy').textContent = activas.reduce((s,c)=>s+compPendientes(c).filter(x=>x.fecha===hoy).length,0);
  const nAct = all.filter(c=>!c.archivada).length;
  const nRonda = all.filter(c=>!c.archivada && atendidaRonda(c)).length;
  $('subCount').textContent = `${nAct} ${nAct===1?'cuenta activa':'cuentas activas'}` +
    (nRonda ? ` · ✓ ${nRonda} atendida${nRonda===1?'':'s'} en esta ronda` : '') +
    (filtro!=='todas' || oficinaSel || busqueda ? ` · mostrando ${list.length}` : '');

  // Filtros con conteo
  $('filters').innerHTML = FILTROS.map(f=>{
    const n = base.filter(c=>f.fn(c,hoy)).length;

function closeComp(id, cid, estado){
  const c = store.cuentas[id]; if(!c) return;
  const x = c.compromisos.find(k=>k.id===cid); if(!x) return;
  const now = new Date().toISOString();
  x.estado = estado; x.cerrado = now;
  c.historial.unshift({id:uid(), ts:now, tipo:'Compromiso', auto:true, resultado: estado==='cumplido'?'Cumplido':'Incumplido',
    comentario:`${money2(x.monto)} del ${fmtFecha(x.fecha)}${x.nota?' · '+x.nota:''}`});
  let msg = estado==='cumplido'?'Marcado como cumplido':'Marcado como incumplido';
  const plan = x.planId && (c.planes||[]).find(p=>p.id===x.planId);
  if(plan && plan.estado==='activo'){
    const ev = evaluarPlan(c, plan);
    if(ev==='cumplido' || ev==='incumplido'){
      plan.estado = ev; plan.cerrado = now;
      if(ev==='incumplido'){
        // Los demás pagos del plan quedan cancelados (ya no aplica el acuerdo).
        c.compromisos.forEach(k=>{ if(k.planId===plan.id && k.estado==='pendiente'){ k.estado='cancelado'; k.cerrado=now; } });
      }
      const cond = plan.condona && plan.multa>0;
      const res = ev==='cumplido' ? (cond ? 'Plan cumplido · condonación PROCEDE' : 'Plan cumplido')
                                  : (cond ? 'Plan incumplido · condonación CANCELADA' : 'Plan incumplido');
      c.historial.unshift({id:uid(), ts:now, tipo:'Plan', auto:true, resultado:res,
        comentario: cond ? `Multa de ${money2(plan.multa)}` + (ev==='cumplido' ? ' — aplicar la condonación' : ' se mantiene') : ''});
      msg = res;
    }
  }
  saveData(); render(); toast(msg);
}

/* Plan de pago */
let pState = null;
function addDays(ymd, n){ const [y,m,d] = ymd.split('-').map(Number); return todayKey(new Date(y, m-1, d+n)); }
function openPlan(id){
  const c = store.cuentas[id] && efectiva(store.cuentas[id]); if(!c) return;
  const activo = (c.planes||[]).find(p=>p.estado==='activo');
  if(activo && !confirm('Esta cuenta ya tiene un plan activo. Si haces uno nuevo, los pagos pendientes del plan anterior se cancelan. ¿Continuar?')) return;
  const condona = puedeCondonar(c);
  const hoy = todayKey();
  pState = {id, condona, totalManual:false, total: planTotalSugerido(c, condona),
    pagos:[{fecha:hoy, monto:'', resto:false}, {fecha:addDays(hoy,2), monto:0, resto:true}], nota:'', reemplaza: activo ? activo.id : null};
  planResto(pState.pagos, pState.total);
  renderPlan();
}
function renderPlan(){
  const c = efectiva(store.cuentas[pState.id]);
  const tercero = esTercero(c), tel = telActivo(c);
  const puedeWA = !tercero && limpiaTel(tel).length === 10;
  const resto = pState.pagos.find(p=>p.resto);
  const suma = pState.pagos.reduce((s,p)=>s+(Number(p.monto)||0),0);
  openSheet(`
    <h2>Plan de pago</h2>
    <div class="sh-sub">${esc(properCase(c.cliente))} · ${esc(TRAMO_LBL[tramo(c)])} · ${esc(c.dias)} días</div>
    <div class="kv-grid section">
      <div><span>Saldo en atraso</span><b>${esc(money2(c.saldo))}</b></div>
      <div><span>Multa (referencia)</span><b>${esc(money2(c.multa))}</b></div>
    </div>
    ${puedeCondonar(c) ? `<label class="check"><input type="checkbox" id="pCond" ${pState.condona?'checked':''}>
        Condonar multa de ${esc(money2(c.multa))} si cumple todos los pagos</label>`
      : `<div class="help">La condonación de multa se ofrece a partir de ${DIAS_CONDONA} días de atraso.</div>`}
    <div class="section"><div class="field-label">Total a cubrir en el plan</div>
      <input class="inp" id="pTotal" type="number" inputmode="decimal" step="0.01" value="${pState.total}">
      <div class="help">${pState.condona && puedeCondonar(c) ? 'Saldo en atraso − multa condonada. ' : 'Saldo en atraso. '}Puedes cambiarlo si negociaste otra cantidad.</div>
    </div>
    <div class="section"><div class="field-label">Pagos</div>
      ${pState.pagos.map((p,i)=>`
        <div class="plan-row">
          <input class="inp" type="date" data-pf="${i}" value="${esc(p.fecha)}">
          <input class="inp" type="number" inputmode="decimal" step="0.01" data-pm="${i}" value="${p.monto===''?'':esc(p.monto)}" ${p.resto?'readonly':''} placeholder="Monto">
          <button class="mini-btn ${p.resto?'on':''}" data-act="p-resto" data-i="${i}">Resto</button>
          ${pState.pagos.length>1?`<button class="mini-btn" data-act="p-del" data-i="${i}">✕</button>`:''}
        </div>`).join('')}
      <button class="btn small" data-act="p-add">＋ Agregar pago</button>
      <div class="plan-sum" id="pSum">${planSumHtml(suma)}</div>
    </div>
    <div class="section"><div class="field-label">Nota (opcional)</div><input class="inp" id="pNota" value="${esc(pState.nota)}" placeholder="Ej. paga en la sucursal"></div>
    ${puedeWA ? '' : `<div class="help" style="margin-top:12px">⚠️ ${tercero ? 'El teléfono en uso es de un tercero. El plan lleva montos, así que solo se envía al titular: cambia a su teléfono para enviarlo.' : 'Sin WhatsApp válido para enviar el plan.'}</div>`}
    <div class="btn-row">
      <button class="btn" data-act="sheet-close">Cancelar</button>
      <button class="btn" data-act="p-save">Guardar</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn primary" data-act="p-save-wa" ${puedeWA?'':'disabled'}>💬 Guardar y enviar por WhatsApp</button>
    </div>`);
}
function planSumHtml(suma){
  const dif = Math.round((suma - (Number(pState.total)||0))*100)/100;
  const neg = pState.pagos.some(p=>p.resto && Number(p.monto) < 0);
  if(neg) return '<span class="flag bad">Los pagos ya superan el total</span>';
  if(Math.abs(dif) >= 0.01) return `<span class="flag warn">Suma ${esc(money2(suma))} · ${dif>0?'sobra':'falta'} ${esc(money2(Math.abs(dif)))}</span>`;
  return `<span class="flag ok">Suma ${esc(money2(suma))} ✓</span>`;
}
function planRecalc(){
  planResto(pState.pagos, Number(pState.total)||0);
  pState.pagos.forEach((p,i)=>{ if(p.resto){ const el = document.querySelector(`[data-pm="${i}"]`); if(el) el.value = p.monto; } });
  const suma = pState.pagos.reduce((s,p)=>s+(Number(p.monto)||0),0);
  const box = $('pSum'); if(box) box.innerHTML = planSumHtml(suma);
}
function planInput(el){
  if(!pState) return;
  if(el.id==='pTotal'){ pState.total = parseMonto(el.value)||0; pState.totalManual = true; planRecalc(); }
  else if(el.id==='pNota'){ pState.nota = el.value; }
  else if(el.dataset.pm !== undefined){ const p = pState.pagos[+el.dataset.pm]; if(!p.resto){ p.monto = el.value===''?'':parseMonto(el.value); planRecalc(); } }
  else if(el.dataset.pf !== undefined){ pState.pagos[+el.dataset.pf].fecha = el.value; }
  else if(el.id==='pCond'){
    const c = efectiva(store.cuentas[pState.id]);
    pState.condona = el.checked;
    if(!pState.totalManual) pState.total = planTotalSugerido(c, pState.condona);
    planResto(pState.pagos, pState.total); renderPlan();
  }
}
function planAction(act, el){
  const i = +el.dataset.i;
  if(act==='p-add'){
    const last = pState.pagos[pState.pagos.length-1];
    const nuevo = {fecha: addDays(last && last.fecha ? last.fecha : todayKey(), 1), monto:0, resto:false};
    // el nuevo pago queda como "resto" si el último lo era
    if(last && last.resto){ last.resto = false; last.monto = ''; nuevo.resto = true; }
    pState.pagos.push(nuevo);
  } else if(act==='p-del'){
    const wasResto = pState.pagos[i].resto;
    pState.pagos.splice(i,1);
    if(wasResto && pState.pagos.length) pState.pagos[pState.pagos.length-1].resto = true;
  } else if(act==='p-resto'){
    pState.pagos.forEach((p,k)=>{ if(k===i) p.resto = !p.resto; else p.resto = false; });
    if(!pState.pagos[i].resto) pState.pagos[i].monto = '';
  }
  planResto(pState.pagos, Number(pState.total)||0);
  renderPlan();
}
function savePlan(enviar){
  const c = store.cuentas[pState.id]; if(!c) return closeSheet();
  planResto(pState.pagos, Number(pState.total)||0);
  const pagos = pState.pagos.map(p=>({fecha:p.fecha, monto:Math.round((Number(p.monto)||0)*100)/100}))
    .sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  if(!pagos.length){ toast('Agrega al menos un pago'); return; }
  if(pagos.some(p=>!p.fecha)){ toast('Falta la fecha de algún pago'); return; }
  if(pagos.some(p=>!(p.monto>0))){ toast('Todos los pagos deben tener monto mayor a 0'); return; }
  const now = new Date().toISOString();
  // Si reemplaza un plan activo, se cancela lo pendiente de ese plan.
  if(pState.reemplaza){
    const viejo = c.planes.find(p=>p.id===pState.reemplaza);
    if(viejo && viejo.estado==='activo'){
      viejo.estado = 'cancelado'; viejo.cerrado = now;
      c.compromisos.forEach(k=>{ if(k.planId===viejo.id && k.estado==='pendiente'){ k.estado='cancelado'; k.cerrado=now; } });
      c.historial.unshift({id:uid(), ts:now, tipo:'Plan', auto:true, resultado:'Plan anterior cancelado (reemplazado)', comentario:''});
    }
  }
  const condona = !!(pState.condona && puedeCondonar(efectiva(c)));
  const plan = {id:uid(), creado:now, total:Math.round((pagos.reduce((s,p)=>s+p.monto,0))*100)/100,
    condona, multa: condona ? Number(c.multa)||0 : 0, nota:pState.nota.trim(), estado:'activo', pagos};
  c.planes.push(plan);
  pagos.forEach((p,k)=>c.compromisos.push({id:uid(), fecha:p.fecha, monto:p.monto,
    nota:`Plan · pago ${k+1} de ${pagos.length}${plan.nota?' · '+plan.nota:''}`, estado:'pendiente', creado:now, cerrado:null, planId:plan.id}));
  c.historial.unshift({id:uid(), ts:now, tipo:'Plan', auto:true, resultado:`Plan de pago: ${pagos.length} ${pagos.length===1?'pago':'pagos'} · total ${money2(plan.total)}`,
    comentario: pagos.map(p=>fmtFecha(p.fecha)+' '+money2(p.monto)).join(' · ') + (condona ? ` · condona multa ${money2(plan.multa)} si cumple` : '') + (plan.nota?' · '+plan.nota:'')});
  let url = null;
  if(enviar){
    const tel = limpiaTel(telActivo(c));
    if(!esTercero(c) && tel.length===10){
      url = 'https://wa.me/52' + tel + '?text=' + encodeURIComponent(planMensaje(c, plan, store.ajustes));
      c.historial.unshift({id:uid(), ts:new Date().toISOString(), tipo:'WhatsApp', resultado:'Plan enviado', comentario:'Confirmación del plan de pagos'});
    }
  }
  saveData(); pState = null; closeSheet(); render();
  if(url) window.open(url, '_blank', 'noopener');
  toast('Plan guardado');
}
function cancelarPlan(id, pid){
  const c = store.cuentas[id]; if(!c) return;
  const plan = c.planes.find(p=>p.id===pid); if(!plan || plan.estado!=='activo') return;
  if(!confirm('¿Cancelar el plan? Los pagos pendientes del plan se marcan como cancelados (no como incumplidos).')) return;
  const now = new Date().toISOString();
  plan.estado = 'cancelado'; plan.cerrado = now;
  c.compromisos.forEach(k=>{ if(k.planId===pid && k.estado==='pendiente'){ k.estado='cancelado'; k.cerrado=now; } });
  c.historial.unshift({id:uid(), ts:now, tipo:'Plan', auto:true, resultado:'Plan cancelado', comentario:''});
  saveData(); render(); toast('Plan cancelado');
}
function reenviarPlan(id, pid){
  const c = store.cuentas[id]; const plan = c && c.planes.find(p=>p.id===pid); if(!plan) return;
  const tel = limpiaTel(telActivo(c));
  if(esTercero(c) || tel.length!==10){ toast('El plan solo se envía al teléfono del titular'); return; }
  window.open('https://wa.me/52' + tel + '?text=' + encodeURIComponent(planMensaje(c, plan, store.ajustes)), '_blank', 'noopener');
}
